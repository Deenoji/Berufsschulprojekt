security:
  # Passwoerter werden automatisch mit dem besten verfuegbaren Algorithmus gehasht.
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

  # User werden anhand der E-Mail aus der Datenbank geladen.
  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  # Rollenhierarchie: Admin schliesst Kunde ein, Kunde schliesst Nutzer ein.
  role_hierarchy:
    ROLE_CUSTOMER: ROLE_USER
    ROLE_ADMIN: [ROLE_CUSTOMER, ROLE_USER]

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      lazy: true
      provider: app_user_provider

      form_login:
        # GET-Seite mit dem Formular:
        login_path: registration_index
        # POST-Ziel, das der Firewall abfaengt (= Route "login" -> /login):
        check_path: login
        # Feldnamen aus dem Twig-Formular:
        username_parameter: _username
        password_parameter: _password
        # CSRF-Schutz; Token-ID "authenticate" passt zu csrf_token('authenticate') im Template:
        enable_csrf: true
        # Wohin nach erfolgreichem Login (bei Bedarf anpassen):
        default_target_path: dashboard

      logout:
        path: app_logout
        target: registration_index

  # Zugriffsregeln (Beispiel - bei Bedarf aktivieren/erweitern):
  access_control:
  # - { path: ^/admin, roles: ROLE_ADMIN }
  # - { path: ^/profile, roles: ROLE_USER }

when@test:
  security:
    password_hashers:
      # Schnellere Hashes in der Test-Umgebung.
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4
        time_cost: 3
        memory_cost: 10